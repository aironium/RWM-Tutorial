[core]
name: tutorial_stealth_tank_type_5

displayText: Type 5 Stealth Tank
displayDescription: -A unit capable of cloaking itself from its surroundings\n-Reveals itself when attacking or when a recon system is nearby\n\n-Sprite by TNABS

tags: c_stealth_tank

class: CustomUnitMetadata
price: 900
maxHp: 180
mass: 2750

techLevel: 2
buildSpeed: 0.0010
#availableInDemo: true

radius: 11
displayRadius: 11

isBio: false
softCollisionOnAll: 0

energyMax:1
energyRegen:0.005

[graphics]
total_frames: 1

image:        type_5_hull.png
image_wreak:  NONE
image_turret: type_5_turret.png

teamColorsOnTurret:true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 4



shootDelay: 35
aimOffsetSpread: 0

[turret_stealthRange]
#
x: 0
y: 0

invisible:true
canShoot:false

limitingRange: 200
showRangeUIGuide:true


[turret_stealthRange2]
#
x: 0
y: 0

invisible:true
canShoot:false

limitingRange: 350
showRangeUIGuide:true

[turret_1]
#
x: 0
y: -1.5

projectile: 1

turnSpeedAcceleration: 1.0

shoot_sound:tank_firing
shoot_sound_vol:0.3
#shoot_flame:small
shoot_light: #FFFFCC
size: 10
canShoot: true

recoilOffset: -2
limitingRange: 175


[projectile_1]
directDamage: 60
life: 100
speed: 3
targetSpeed:5
#instant: true
instantReuseLast: true
drawType:2
frame:4
turnSpeed: 0

drawSize: 0.65
color: #FFFFCC
lightColor: #FFFFCC
lightCastOnGround: true

[movement]
movementType: LAND
moveSpeed: 1.25
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.17

maxTurnSpeed: 4.1
turnAcceleration: 0.25

moveSlidingMode :false
moveIgnoringBody:false

[core]
@memory counter:number
updateUnitMemory: counter = select(self.hasFlag(id = 1),memory.counter + 1,  0)

[action_cloak]
text: Cloak
description: Activate cloaking systems\n\nOnly the player and allies can see the unit.\nCloak will be lost if the unit attacks or if there is a recon system nearby
buildSpeed: 5s
price: setFlag=1
addResources: unsetFlag=1
tags: action_cloak
canPlayerCancel: false
alwaysSinglePress: true
allowMultipleInQueue: false
clearAllWaypoints: true
clearActiveWaypoint: true
whenBuilding_cannotMove: true
convertTo: tutorial_stealth_tank_type_5_stealth
isActive: if (self.attacking() == nullUnit) and numberOfUnitsInEnemyTeam(withTag='radar', withinRange=200) < 1 and numberOfUnitsInEnemyTeam(withTag='superRadar', withinRange=350) < 1