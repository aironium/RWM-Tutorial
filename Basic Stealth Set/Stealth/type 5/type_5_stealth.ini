[core]

copyFrom: type_5.ini
name: tutorial_stealth_tank_type_5_stealth
showOnMinimapToEnemies: false
canNotBeDirectlyAttacked: true
showInEditor: false

[graphics]
total_frames: 1

image:        type_5_hull.png
image_turret: type_5_turret.png
isVisibleToEnemies: false

[attack]
canAttack: true
disablePassiveTargeting: true

[movement]
moveSpeed: 1.25

[action_reveal]
convertTo: tutorial_stealth_tank_type_5
addResources: unsetFlag=1
price: 0
buildSpeed: 0s
text: Reveal
description: Disables the cloaking of the unit

[hiddenAction_revealWhenRadar]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='radar', withinRange=200) > 0
alsoTriggerAction: reveal

[hiddenAction_revealWhenRadarSuper]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='superRadar', withinRange=350) > 0
alsoTriggerAction: reveal

[turret_1]
onShoot_triggerActions: reveal


[action_cloak]
@copyFrom_skipThisSection: true
