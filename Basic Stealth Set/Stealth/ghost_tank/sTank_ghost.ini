
[core]


name: sTank_ghost
displayText: Ghost Tank
displayDescription: -A unit capable of cloaking itself from its surroundings\n-Reveals itself when attacking or when a recon system is nearby





class: CustomUnitMetadata
price: 350
maxHp: 210
mass: 3000

techLevel: 1
buildSpeed: 0.0020
#availableInDemo: true

radius: 11
displayRadius: 11

isBio: false
softCollisionOnAll: 0

[graphics]
total_frames: 3

image:        tank.png
image_wreak:  tank_dead.png
image_turret: tank_turret.png


imageScale:0.8
turretImageScale:0.8

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 1


dustEffect: true

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 20
turretTurnSpeed: 4


maxAttackRange: 130
shootDelay: 75

[turret_1]
#
x: 0
y: 0

projectile: 1

turnSpeedAcceleration: 1.0

shoot_sound:tank_firing
shoot_sound_vol:0.3
shoot_flame:small
shoot_light:#FFEECCCC

canShoot: true


recoilOffset: -2


[projectile_1]
directDamage: 25
life: 60
speed: 5

frame: 1

drawSize: 1


[movement]
movementType: LAND
moveSpeed: 1.1
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17

maxTurnSpeed: 4.1
turnAcceleration: 0.25

moveSlidingMode :false
moveIgnoringBody:false

#stealth behavior

[core]
showInEditor: false
#canNotBeDirectlyAttacked: true
canOnlyBeAttackedByUnitsWithTags: stealthBuster
showOnMinimapToEnemies: false

[graphics]
isVisibleToEnemies: false

[action_reveal]
text: Disable Stealth
convertTo: sTank
buildSpeed: 0s
allowMultipleInQueue: false
price: 0

[turret_1]
onShoot_triggerActions: reveal

[hiddenAction_revealWhenRadar]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='radar', withinRange=200) > 0
alsoTriggerAction: reveal

[hiddenAction_revealWhenRadarSuper]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='superRadar', withinRange=350) > 0
alsoTriggerAction: reveal

